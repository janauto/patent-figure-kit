# PR 门禁（架构 §3.3 / WP4）：ubuntu-22.04 + Python 3.11 跑验收（N14 即完整 pytest，含 N10 金样），
# 外加部署文件的静态检查。只读权限；不发布任何东西。
name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: 验收（ubuntu-22.04 / Python 3.11）
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 系统依赖（OCP 的 libGL / libX11、中文字体）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libx11-6 fonts-noto-cjk
      - name: 安装锁定依赖
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements-pinned.txt -r requirements-web.txt pyyaml==6.0.3
      - name: 环境自检（Web / 导出 profile）
        run: python scripts/pfk_cli.py doctor --profile web
      - name: pytest + 验收（N14 = 完整 pytest；N10 金样不变）
        run: python acceptance/run_acceptance.py --json acceptance.json
      - name: 记录环境
        if: always()
        run: |
          if [ -f acceptance.json ]; then
            python scripts/verified_envs.py record --acceptance acceptance.json --label ubuntu-22.04 \
              --source "CI ${{ github.workflow }} #${{ github.run_number }}" --commit "${GITHUB_SHA::12}" \
              --out records/env-ubuntu-22.04-py3.11.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-acceptance
          path: |
            acceptance.json
            records/
          if-no-files-found: ignore

  deploy-lint:
    name: 部署文件静态检查
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck（安装脚本）
        run: shellcheck -s bash install.sh 安装并启动.command
      - name: hadolint（Dockerfile）
        run: docker run --rm -i hadolint/hadolint:v2.12.0 < Dockerfile
      - name: Caddyfile 校验
        run: |
          docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e PFK_SITE_ADDRESS=localhost -e PFK_UPSTREAM=app:8790 -e PFK_BASIC_USER=pfk \
            -e 'PFK_BASIC_HASH=$2a$14$Zkx19XLiW6VYouLHR5NmfOFU0z2GTNmpkT/5qqR7hx4IjWJPDhjvG' \
            caddy:2.8.4-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: compose 校验
        run: |
          PFK_TENANT=lint WORKBENCH_TOKEN=x PFK_PUBLIC_URL=https://localhost PFK_SITE_ADDRESS=localhost \
          PFK_BASIC_USER=pfk PFK_BASIC_HASH=x docker compose config --quiet
      - name: PowerShell 脚本语法（UTF-8 BOM + 解析）
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("安装并启动.ps1")
          if ($bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) { throw "安装并启动.ps1 必须是 UTF-8 带 BOM" }
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/安装并启动.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | Format-List; throw "PowerShell 语法错误" }
