openapi: 3.0.3
info:
  title: 专利附图工作台 REST API
  version: "1.0.0"
  description: >
    patent-figure-kit 工作台的 HTTP 契约（架构 v1 §6，WP1 冻结）。前端代理对本文件打 mock，
    字段名与实现（scripts/workbench.py）一致。两类调用方：浏览器会话（Cookie `wb_token`）与
    Agent（`Authorization: Bearer <token>`）。所有 `/v1/*`、`/mcp` 需要鉴权。
    服务默认只绑 127.0.0.1 并校验 Host 头。

    作业模型：长任务（新建工程、出图、导出）立即返回 202 + 作业 id，通过 GET /v1/jobs/{id}
    轮询或 GET /v1/jobs/{id}/events（SSE，带 event id，支持 Last-Event-ID 重连）订阅。
    状态机：queued → running → {succeeded | failed | cancelled | interrupted}；进程崩溃后
    未完成作业标 interrupted（不假装恢复）。旧同步 render 以 `?wait=1` 保留。

    WP2 增补（契约 §14）：能力接口 `GET /v1/capabilities`；候选分图作业 + 接受
    （`/plan/suggest`、`/plan/candidates`、`/plan/candidates/accept`）；附图导出包（PDF/Word 主交付 +
    逐页核验，`ExportResult`）；QA 每项的 `title_zh / hint_plain / fix_action`（`QACheck`）；AI 起名
    接力语义冻结（`DraftTermsResult`）；`?token=` 仅兼容期，命中时响应带 `Deprecation: true` 与
    `Warning` 头。
servers:
  - url: http://127.0.0.1:8790
    description: 本机默认实例
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: "Agent 用 `Authorization: Bearer <token>`。"
    sessionCookie:
      type: apiKey
      in: cookie
      name: wb_token
      description: 浏览器会话 Cookie（首页 ?token= 引导后由服务下发，HttpOnly）。SSE/下载走它。
    queryToken:
      type: apiKey
      in: query
      name: token
      description: >
        旧版查询参数鉴权，保留一个版本用于兼容已配置的客户端，后续弃用；新客户端请用 Bearer
        或会话 Cookie（见 docs/impl-contract 与工作台设置页的迁移说明）。WP2：只凭 ?token= 通过
        鉴权的受保护请求（/api/wb、/v1、/mcp、/files 与子应用 /p/{pid}/api/*），响应带
        `Deprecation: true`、`Warning: 299 - "Query-string token is deprecated; …"`、
        `X-Auth-Deprecated: query-token`。首页 `/?token=` 是下发会话 Cookie 的引导，不算弃用。
  schemas:
    Error:
      type: object
      properties:
        code: {type: string, example: E_JOB_FAILED}
        message: {type: string}
        hint: {type: string}
    JobRef:
      type: object
      required: [project_id, job_id]
      properties:
        project_id: {type: string}
        job_id: {type: string}
    InputSnapshot:
      description: 提交时冻结的输入指纹，保证作业画的是提交那一刻的 plan。
      type: object
      properties:
        plan_hash: {type: string}
        terms_hash: {type: string}
        step_sha: {type: string}
        plan_etag: {type: string}
    Job:
      type: object
      required: [id, kind, project_id, state]
      properties:
        id: {type: string}
        kind: {type: string, enum: [prepare, render, export, from-example, suggest]}
        project_id: {type: string}
        state:
          type: string
          enum: [queued, running, succeeded, failed, cancelled, interrupted]
        stage: {type: string, description: 粗粒度阶段名（render/export/analyze…）}
        progress: {type: number, minimum: 0, maximum: 1}
        inputs: {$ref: '#/components/schemas/InputSnapshot'}
        logs: {type: array, items: {type: string}}
        result: {type: object, nullable: true}
        error: {allOf: [{$ref: '#/components/schemas/Error'}], nullable: true}
        idempotency_key: {type: string, nullable: true}
        created_at: {type: number}
        updated_at: {type: number}
        last_event_id: {type: integer}
    ExportManifest:
      type: object
      properties:
        export_id: {type: string}
        manifest:
          type: object
          additionalProperties: {type: string, enum: [ok, skip, fail]}
          description: 每种格式的结果（ok/skip/fail）。dwg 在无转换器时为 skip。
        files: {type: array, items: {type: string}}
        download_url: {type: string}
    RenderJobDiag:
      description: 本次作业版本的诊断信息（失败时用来定位问题；不代表已发布）。
      type: object
      nullable: true
      properties:
        version: {type: string, description: 本次作业的版本 id（= 渲染作业 id）}
        version_dir: {type: string, description: 本次版本目录（本机路径）}
        diag_dir: {type: string, nullable: true, description: 未过闸图的隔离目录（本机路径），无则 null}
        sealed: {type: boolean}
        published: {type: boolean, description: 本次版本是否就是当前已发布版本}
        failed_figures: {type: array, items: {type: string}}
        missing_artefacts: {type: array, items: {type: string}}
        log_tail: {type: string}
    RenderJobStatus:
      description: >
        「本次渲染作业」的状态——与「已发布版本」严格分开（R1e #5 / R1f #2）。失败时 result 仍是
        上一已发布版本，本次失败只在这里体现。
      type: object
      properties:
        id: {type: string, nullable: true}
        state: {type: string, nullable: true, enum: [queued, running, succeeded, failed, cancelled, interrupted, null]}
        stage: {type: string, nullable: true}
        running: {type: boolean}
        ok: {type: boolean, nullable: true}
        error: {nullable: true, description: 失败原因（结构化 Error 或日志尾）}
        result: {type: object, nullable: true, description: "本次作业自己的结果（含逐图 QA 失败项）；预览 URL 绑定本次版本 ?v=<id>"}
        diag: {$ref: '#/components/schemas/RenderJobDiag'}
    RenderStatus:
      description: >
        浏览器子应用 GET /p/{pid}/api/render/status 的语义（冻结）：
        result = 当前**已发布**版本（来自版本库快照；预览 URL 带 ?v=<version>；从未发布则 null）；
        version = 该已发布版本 id；job = **本次（最近一次）渲染作业**状态（RenderJobStatus）。
        「成功后再失败」时 result 仍是旧的好版本、job.state=failed 并带 error/diag——前端必须读 job
        才能显示本次失败，并标明预览/导出属于上一成功版本。
      type: object
      required: [running, result, version, job]
      properties:
        running: {type: boolean}
        started: {type: string, nullable: true}
        result: {type: object, nullable: true, description: 已发布版本的结果（含 version 字段）}
        version: {type: string, nullable: true}
        job: {$ref: '#/components/schemas/RenderJobStatus'}
    FixAction:
      description: QA 修复动作（F4）。kind 冻结为四种；null 表示不是用户可改的问题（写出端缺陷，请反馈）。
      type: object
      nullable: true
      properties:
        kind: {type: string, enum: [open_terms, split_figure, change_view, change_density]}
        target:
          type: object
          description: "至少含 figure（图 id）；可选 focus（standard_parts|names）、density（loose）、engineering_table（false）"
          properties:
            figure: {type: string}
            focus: {type: string, enum: [standard_parts, names]}
            density: {type: string, enum: [loose, compact, normal]}
            engineering_table: {type: boolean}
    QACheck:
      description: >
        qa.json 每项检查（13 项，顺序固定）。WP2 F4 增补 title_zh / hint_plain / fix_action：
        hint 是给 Agent 的精确计划级指令（含 terms[].label 等字段名）；hint_plain 是给人的白话，
        不含 JSON 字段名。前端有静态映射时，后端字段存在则优先用后端。
      type: object
      required: [id, pass, value, threshold, detail, hint, title_zh, hint_plain, fix_action]
      properties:
        id:
          type: string
          enum: [geometry_occupancy, sheet_fill, text_height_mm, text_slot_ratio,
                 label_overlap_pairs, leader_hits_numeral_box, leader_crossing,
                 leader_anchor_gap, part_bbox_overlap_pairs, labels_per_figure,
                 non_numeral_text_ratio, non_continuous, forbidden_text,
                 file_readable, qa_internal_error]
        pass: {type: boolean}
        value: {description: 实测值}
        threshold: {type: string}
        detail: {type: string}
        hint: {type: string}
        title_zh: {type: string, example: 引线落点}
        hint_plain: {type: string}
        fix_action: {$ref: '#/components/schemas/FixAction'}
    MemberRef:
      description: >
        候选成员引用（吸收 Codex R3c #6）：真实零件名 {part}，或稳定组引用 {group}
        （sub:<装配路径> | coax:<同轴组 id> | split:<策略>/<序号>）。显示名从不出现在这里。
      type: object
      properties:
        part: {type: string, description: "assembly.json parts[].name，原样"}
        group: {type: string, example: "sub:DEMO-VISE-ASSY/VISE-SPINDLE-ASM"}
    AmbiguousMember:
      description: 同名跨子装配：按名称选中的实例多于本组（plan 按名称选零件）。
      type: object
      properties:
        part: {type: string}
        selected: {type: integer, description: 按名称会选中的实例数}
        in_group: {type: integer, nullable: true, description: 其中属于本组的实例数（同轴组未知时 null）}
        outside_paths: {type: array, items: {type: string}}
        message: {type: string, example: 按名称选中 2 处（其中 1 处不在本组内）}
    Candidate:
      description: >
        一个候选分图。只有实际渲染 + 过 QA 闸门之后 status 才是 pass/fail；没渲染为 pending。
        members 只放真实零件 {part}（后端产出时从不用 {group}，接受时可用）；显示名在 members_display。
      type: object
      required: [id, fig_id, caption, kind, source, members, members_display, status, reason]
      properties:
        id: {type: string, example: c3}
        fig_id: {type: string, description: 同 id（与 WP3 mock 字段对齐）}
        caption: {type: string, example: 丝杠组件分解示意图}
        kind: {type: string, enum: [assembly, exploded]}
        source:
          type: object
          properties:
            kind: {type: string, enum: [whole, axis, split, subassembly, coaxial]}
            id: {type: string, example: "sub:DEMO-VISE-ASSY/VISE-SPINDLE-ASM"}
            label: {type: string}
        members: {type: array, items: {$ref: '#/components/schemas/MemberRef'}}
        members_display: {type: array, items: {type: string}, description: 与 members 一一对应的显示名（中文名或零件名）}
        labels: {type: integer, description: 试渲染计划下的有效标号数}
        standard_parts: {type: array, items: {type: string}, description: 本候选里按标准件规则 label:none 的零件}
        placeholder_terms: {type: integer, description: 试渲染时为空白术语填了几个占位名（不写回计划）}
        ambiguous_members: {type: array, items: {$ref: '#/components/schemas/AmbiguousMember'}}
        status: {type: string, enum: [pass, fail, pending]}
        reason: {type: string, description: 白话原因（不含 JSON 字段名）}
        detail: {type: string, nullable: true, description: 渲染器原始报错（技术细节，可折叠显示）}
        suggestion: {type: string, nullable: true}
        plan_errors: {type: array, items: {type: object}}
        qa:
          type: object
          nullable: true
          properties:
            pass: {type: boolean}
            failed:
              type: array
              items:
                type: object
                properties:
                  id: {type: string}
                  title_zh: {type: string}
                  hint_plain: {type: string}
                  fix_action: {$ref: '#/components/schemas/FixAction'}
            text_height_mm: {type: number, nullable: true}
            labels: {type: integer, nullable: true}
            error_code: {type: string}
        version: {type: string, nullable: true, description: 候选专属版本 id（<job_id>-c<k>，在 <工程>/candidates/ 版本库，从不成为 current）}
        preview:
          type: object
          nullable: true
          description: 只对 pass 候选给出；URL 形如 /files/{pid}/cand/fig1.svg?v=<version>（只服务已封口的候选版本）
          properties:
            svg: {type: string}
    SuggestRequest:
      type: object
      properties:
        label_standard_parts: {type: boolean, default: false, description: true = 标准件也发标记（关闭默认 label:none）}
        max_candidates: {type: integer, minimum: 1, maximum: 16, default: 8}
        standard_part_rule:
          type: object
          description: 覆盖标准件规则（契约 §14.2）；pattern / except 为正则，IGNORECASE，英文按整词
          properties:
            pattern: {type: string, default: "SCREW|BOLT|NUT|WASHER|PIN|BEARING|螺钉|螺栓|螺母|垫圈|销|轴承"}
            except: {type: string, default: "(?:LEAD|BALL)[-_ ]?(?:SCREW|NUT)|丝杠|丝母"}
            whole_word_latin: {type: boolean, default: true}
    SuggestResult:
      description: 候选分图作业（kind=suggest）成功后的 Job.result。
      type: object
      properties:
        schema: {type: string, example: patent-figure-candidates/1}
        project_id: {type: string}
        job_id: {type: string}
        plan_etag: {type: string, description: 提交时的 plan ETag}
        assembly_sha256: {type: string}
        standard_part_rule: {type: object}
        label_standard_parts: {type: boolean}
        standard_parts: {type: array, items: {type: string}}
        instances_exact: {type: boolean, description: false = 缺逐实例路径，同名跨子装配无法识别（见 warnings）}
        candidates: {type: array, items: {$ref: '#/components/schemas/Candidate'}}
        summary:
          type: object
          properties: {total: {type: integer}, pass: {type: integer}, fail: {type: integer}, pending: {type: integer}}
        empty_reason: {type: string, nullable: true, description: 没有候选通过（或无可出图零件）时的白话原因；有通过的为 null}
        guide:
          type: object
          nullable: true
          description: 「请框选分组」引导（仅 empty_reason 非空时给出）
          properties:
            action: {type: string, enum: [box_select]}
            title: {type: string, example: 请框选分组}
            steps: {type: array, items: {type: string}}
        warnings: {type: array, items: {type: string}}
    AcceptCandidatesRequest:
      type: object
      required: [candidate_ids]
      properties:
        job_id: {type: string, description: 候选分图作业 id；缺省取该工程最近一次}
        candidate_ids: {type: array, items: {type: string}, minItems: 1}
        mode: {type: string, enum: [append, replace], default: append}
        apply_standard_labels: {type: boolean, default: true, description: 把候选的 standard_parts 写成 label:none（仅当管辖该零件的术语行只覆盖标准件时）}
        members:
          type: object
          description: 可选：按候选 id 覆盖成员（用户在界面上改组后提交），值为 MemberRef 数组
          additionalProperties: {type: array, items: {$ref: '#/components/schemas/MemberRef'}}
        plan_etag: {type: string, description: 与 If-Match 等价}
    AcceptCandidatesResult:
      type: object
      properties:
        ok: {type: boolean}
        plan_etag: {type: string, description: 写入后的新 ETag（响应头 ETag 同值）}
        mode: {type: string}
        added_figures: {type: array, items: {type: string}, example: [fig2, fig3]}
        standard_labels_set: {type: array, items: {type: string}}
        standard_labels_skipped: {type: array, items: {type: string}}
        accepted_failed: {type: array, items: {type: string}, description: 被接受但试渲染未过闸的候选 id（允许，仅提示）}
        plan_valid: {type: boolean}
        issues: {type: array, items: {type: object}}
    PageCheck:
      type: object
      properties:
        page: {type: integer}
        figure: {type: string}
        ok: {type: boolean}
        errors: {type: array, items: {type: string}}
        page_mm: {type: array, items: {type: number}}
        image_mm: {type: object, properties: {left: {type: number}, top: {type: number}, width: {type: number}, height: {type: number}}}
        image_px: {type: array, items: {type: integer}}
        dpi_effective: {type: number}
        scale: {type: number, description: 页面图宽 ÷ 源图取景窗宽（不放大，≤1）}
        min_text_mm: {type: number, nullable: true}
        min_text_px: {type: number, nullable: true}
        caption: {type: string, nullable: true, example: 图1}
        caption_ink: {type: number, nullable: true, description: 图号位置的墨迹占比（从文件里的图片像素算）}
    DocumentCheck:
      description: 对写出的 PDF / Word 文件本身逐页核验（deliverable_check），不信任写出端自报。
      type: object
      properties:
        file: {type: string, example: 说明书附图_递交版.pdf}
        format: {type: string, enum: [pdf, docx]}
        ok: {type: boolean}
        pages: {type: integer}
        expected_pages: {type: integer, description: = 本版本结构附图数（流程图不进 PDF/Word）}
        errors: {type: array, items: {type: string}}
        page_checks: {type: array, items: {$ref: '#/components/schemas/PageCheck'}}
        path: {type: string, nullable: true, description: 包内相对路径；不通过（含核验程序异常）的在 _未通过核验/ 下}
        layout_verified:
          type: string
          enum: [file-geometry, structural]
          description: >
            file-geometry = PDF 的页幅与图片位置取自文件里的绘制指令与像素；structural = Word 按文档结构
            严格等价核验（单节、规范页幅页边、每段恰一张行内图片、零缩进单倍行距居中、第 2 段起段前分页、
            无额外段落/分页/样式），没有用 Word 排版引擎实测
        layout_note: {type: string, example: "Word 按文档结构核验，实际排版以 Word 打开为准"}
    ExportItem:
      description: 导出屏的逐「版本 × 格式」汇总行。
      type: object
      properties:
        variant: {type: string, enum: [递交版, 交底版, 原始]}
        format: {type: string, enum: [pdf, docx, dxf, dwg, png, svg]}
        status: {type: string, enum: [ok, skip, fail]}
        reason: {type: string}
        figures: {type: integer}
        file: {type: string, nullable: true}
        role: {type: string, enum: [主交付, 源文件，供再编辑, 预览]}
    ExportResult:
      description: 导出作业（kind=export）成功后的 Job.result（GET /v1/exports/{id} 返回 Job，清单在 result 内）。
      type: object
      properties:
        export_id: {type: string}
        render_job_id: {type: string}
        render_plan_etag: {type: string}
        ok: {type: boolean, description: 没有任何请求项 fail}
        manifest:
          type: object
          additionalProperties: {type: string, enum: [ok, skip, fail]}
          description: 键 "图号/版本/格式"（版本为 交底版/递交版）
        reasons:
          type: object
          additionalProperties: {type: string}
          description: 每个 skip/fail 项的原因
        items: {type: array, items: {$ref: '#/components/schemas/ExportItem'}}
        documents:
          type: object
          additionalProperties: {$ref: '#/components/schemas/DocumentCheck'}
        missing_files: {type: array, items: {type: string}}
        files: {type: array, items: {type: string}}
        spec: {type: object, description: 本次版式（页幅、页边、图区预设、dpi、字高阈值）}
        note: {type: string, example: 精确图片参数以当期《电子申请文件格式要求说明》为准}
        notes: {type: array, items: {type: string}}
        dwg_log: {type: array, items: {type: string}}
        download_url: {type: string}
    Capabilities:
      type: object
      properties:
        display_name: {type: string, example: 墨线}
        export:
          type: object
          properties:
            formats: {type: array, items: {type: string}}
            primary_formats: {type: array, items: {type: string}, example: [pdf, docx]}
            source_formats: {type: array, items: {type: string}, example: [dxf, dwg]}
            variants: {type: object}
            pdf_available: {type: boolean}
            pdf_check_available: {type: boolean, description: false = 缺 pypdf，PDF 会被如实报 fail}
            docx_available: {type: boolean}
            dwg_available: {type: boolean, description: false 时前端事前禁选 DWG；后端对 DWG 一律 skip 并给原因}
            dwg_route: {type: string, nullable: true, enum: [autocad, libredwg, null]}
            unavailable_reasons: {type: object, additionalProperties: {type: string}}
            sheet_presets: {type: object}
            default_preset: {type: string}
            dpi: {type: object, properties: {default: {type: integer}, min: {type: integer}, max: {type: integer}}}
            page: {type: object}
            min_text_mm: {type: number}
            min_text_px: {type: number}
            note: {type: string, description: 界面/README 旁注原文}
            layout_verification:
              type: object
              description: 各格式的版面核验方式（pdf=file-geometry、docx=structural）与 Word 旁注
              properties:
                pdf: {type: string}
                docx: {type: string}
                docx_note: {type: string}
            files: {type: array, items: {type: string}}
        ai:
          type: object
          properties:
            configured: {type: boolean}
            provider: {type: string}
            provider_label: {type: string}
            outbound_fields: {type: array, items: {type: string}, example: [part_names, part_codes]}
            outbound_note: {type: string}
        suggest: {type: object}
        examples: {type: array, items: {type: string}}
        auth: {type: object}
    DraftTermsRequest:
      type: object
      properties:
        selectors: {type: array, items: {type: string}, description: 选中的零件名；缺省 = 全部空白术语的零件}
        apply: {type: boolean, default: false, description: true 时服务端经 project_io.update_plan 只填空白并返回新 ETag}
        plan_etag: {type: string, description: 与 If-Match 等价（apply 时校验）}
    DraftTermsResult:
      type: object
      properties:
        status: {type: string, enum: [ok, ai_not_configured]}
        project_id: {type: string}
        ai_configured: {type: boolean}
        provider: {type: string}
        provider_label: {type: string}
        outbound_fields: {type: array, items: {type: string}, example: [part_names, part_codes]}
        outbound_note: {type: string}
        suggestions:
          type: array
          items:
            type: object
            properties:
              selector: {type: string}
              term: {type: string}
              label: {type: string, enum: [once, none]}
              confidence: {type: string, enum: [high, medium, low]}
              reason: {type: string}
        skipped:
          type: array
          items: {type: object, properties: {selector: {type: string}, reason: {type: string}}}
        applied:
          type: object
          nullable: true
          properties:
            filled: {type: array, items: {type: string}}
            kept_human: {type: array, items: {type: string}}
            added: {type: array, items: {type: string}}
        plan_etag: {type: string, description: 当前（apply 后为新）plan ETag；响应头 ETag 同值}
        hint: {type: string}
security:
  - bearer: []
  - sessionCookie: []
  - queryToken: []
paths:
  /v1/projects:
    get:
      tags: [工程]
      summary: 列出工程
      responses:
        "200": {description: 工程列表}
    post:
      tags: [工程]
      summary: 新建工程（异步准备）
      description: >
        接收 STEP：multipart/form-data 字段 `step`（可选 `title`），或 application/octet-stream
        原始体（`title`/`name` 走查询参数）。202 返回 {project_id, job_id}，准备在后台作业跑。
      parameters:
        - {in: query, name: title, schema: {type: string}}
        - {in: query, name: name, schema: {type: string}}
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                step: {type: string, format: binary}
                title: {type: string}
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        "202":
          description: 已受理
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JobRef'}
        "422": {description: STEP 无效}
  /v1/projects/from-example:
    post:
      tags: [工程]
      summary: 从内置示例新建/引用工程
      description: >
        gearbox / vise / valve 是三个公开演示模型（WP2）：首次使用时作业里现场生成 STEP（OCP 只在
        生成器子进程里）、建工程 example-<名> 并装入示例计划；作业等到工程 ready 才 succeeded。
        synthetic 为仓库自带合成装配体。已存在则直接引用。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [example]
              properties:
                example: {type: string, enum: [gearbox, vise, valve, synthetic], example: vise}
      responses:
        "202":
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JobRef'}
        "404": {description: 没有该示例}
  /v1/capabilities:
    get:
      tags: [工程]
      summary: 能力：导出格式与 DWG 可用性、版式预设、AI 通道与外发字段（事前告知，前端据此禁选）
      responses:
        "200":
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Capabilities'}
  /v1/projects/{pid}:
    parameters: [{in: path, name: pid, required: true, schema: {type: string}}]
    get:
      tags: [工程]
      summary: 工程摘要（含 plan_etag 与最近一次候选分图状态）
      responses:
        "200":
          description: >
            工程摘要 + plan_etag + candidates（{job_id, state, summary, empty_reason, url}，没生成过为 null）
  /v1/projects/{pid}/plan:
    parameters: [{in: path, name: pid, required: true, schema: {type: string}}]
    get:
      tags: [工程]
      summary: 读取 figure-plan（带 ETag）
      responses:
        "200":
          description: plan 内容
          headers:
            ETag: {schema: {type: string}, description: plan 当前版本}
          content: {application/json: {schema: {type: object}}}
        "404": {description: 还没有 plan}
    put:
      tags: [工程]
      summary: 覆盖 figure-plan（If-Match，冲突 409）
      parameters:
        - {in: header, name: If-Match, schema: {type: string}, description: 期望的 plan ETag}
      requestBody:
        required: true
        content: {application/json: {schema: {type: object}}}
      responses:
        "200":
          description: 已更新
          headers: {ETag: {schema: {type: string}}}
        "409": {description: ETag 不匹配（plan 已被他人修改）}
  /v1/projects/{pid}/parts:
    parameters:
      - {in: path, name: pid, required: true, schema: {type: string}}
      - {in: query, name: only_unnamed, schema: {type: boolean, default: true}}
    get: {tags: [工程], summary: 零件清单, responses: {"200": {description: ok}}}
  /v1/projects/{pid}/structure:
    parameters: [{in: path, name: pid, required: true, schema: {type: string}}]
    get: {tags: [工程], summary: 结构组, responses: {"200": {description: ok}}}
  /v1/projects/{pid}/terms:
    parameters: [{in: path, name: pid, required: true, schema: {type: string}}]
    post:
      tags: [工程]
      summary: 写入零件中文名
      requestBody: {content: {application/json: {schema: {type: object}}}}
      responses: {"200": {description: ok}}
  /v1/projects/{pid}/ai/draft-terms:
    parameters: [{in: path, name: pid, required: true, schema: {type: string}}]
    post:
      tags: [AI]
      summary: AI 起名接力（语义冻结，契约 §14.4）
      description: >
        输入选中的 selectors；**只对空白术语**返回建议（confidence + reason），人填过的进 skipped；
        外发载荷在序列化边界限定为「选中且空白」的零件——其他零件的名称、计划里的术语、术语库与 BOM
        条目一律不外发（修复轮 1）；
        **默认不写 plan**——前端经 PUT /plan（If-Match）落盘；apply=true 时服务端经
        project_io.update_plan 只填空白并返回新 ETag（If-Match / plan_etag 不符 409）。
        没有大模型通道 → 200 + status=ai_not_configured（不发任何外部请求）。每次都返回
        outbound_fields 供外发前明示。（MCP 工具 ai_draft_terms 为兼容旧客户端 apply 缺省 true。）
      parameters:
        - {in: header, name: If-Match, schema: {type: string}, description: apply=true 时的期望 ETag}
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DraftTermsRequest'}
      responses:
        "200":
          headers: {ETag: {schema: {type: string}}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DraftTermsResult'}
        "409": {description: apply=true 且 ETag 不匹配}
        "422": {description: selectors 不是字符串数组}
        "502": {description: "大模型通道调用失败（error.code = ai_call_failed）"}
  /v1/projects/{pid}/render:
    parameters:
      - {in: path, name: pid, required: true, schema: {type: string}}
      - in: query
        name: wait
        schema: {type: integer, enum: [0, 1], default: 0}
        description: >
          wait=1 提交同一作业并在服务线程池里**非阻塞**等待该 job 完成（不阻塞事件循环/SSE/取消）；
          成功 200 返回该次渲染结果，失败 200 返回 {state, error, result}，超时 202 + job_id
          （绝不返回上一次的结果）。wait=0（默认）立即 202 + job_id。
      - in: query
        name: timeout
        schema: {type: number, default: 600}
        description: wait=1 的等待上限秒数，超时返回 202 + job_id。
    post:
      tags: [出图]
      summary: 出图（异步 202 + job_id；?wait=1 非阻塞等待同一作业）
      parameters:
        - {in: header, name: Idempotency-Key, schema: {type: string}}
      responses:
        "202":
          description: 已排队（或 wait=1 超时）
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: {type: string}
                  inputs: {$ref: '#/components/schemas/InputSnapshot'}
        "200": {description: wait=1 且作业已终态时的结果（成功为渲染结果，失败含 error/result）}
  /v1/projects/{pid}/plan/suggest:
    parameters: [{in: path, name: pid, required: true, schema: {type: string}}]
    post:
      tags: [工程]
      summary: 候选分图（202 → kind=suggest 作业：生成候选 + 一个作业内串行试渲染全部候选）
      description: >
        候选来源：整机装配图（兜底，允许被闸门拦下）、沿主轴整机分解图、split_suggestions、每个
        子装配 / 同轴组一张分解图。每个候选实际渲染 + 过 QA 后才有 pass/fail；产物进候选专属版本库
        （<工程>/candidates/），**不改当前版本**。作业 result 为 SuggestResult；SSE stage 事件逐个报告
        「试渲染候选 k/N」。可 DELETE /v1/jobs/{id} 取消（中止进行中的试渲染）。
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SuggestRequest'}
      responses:
        "202":
          content:
            application/json:
              schema:
                type: object
                properties: {project_id: {type: string}, job_id: {type: string}}
        "400": {description: standard_part_rule 不是合法正则 / max_candidates 越界}
        "409": {description: 工程还没准备好}
  /v1/projects/{pid}/plan/candidates:
    parameters: [{in: path, name: pid, required: true, schema: {type: string}}]
    get:
      tags: [工程]
      summary: 最近一次候选分图作业（Job，result 为 SuggestResult）
      responses:
        "200": {content: {application/json: {schema: {$ref: '#/components/schemas/Job'}}}}
        "404": {description: 还没生成过候选}
  /v1/projects/{pid}/plan/candidates/accept:
    parameters: [{in: path, name: pid, required: true, schema: {type: string}}]
    post:
      tags: [工程]
      summary: 接受候选分图写入计划（先在当前装配体上解析每个成员，解析不了 422）
      description: >
        每个被接受的候选写成一张分图（id 取 figN 空号，members 为转义后的精确零件名选择器），给没有
        术语行的成员补空白术语行，标准件按 apply_standard_labels 写 label:none。成员的断言在 plan 锁内
        完成，任一成员（零件不存在 / 退化 / 被 source 排除 / 组解析不到）解析不了 → 422，计划不变。
        装配体与候选生成时不同（sha256 变了）→ 409。经 project_io.update_plan 写入，If-Match 不符 409。
      parameters:
        - {in: header, name: If-Match, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AcceptCandidatesRequest'}
      responses:
        "200":
          headers: {ETag: {schema: {type: string}}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AcceptCandidatesResult'}
        "400": {description: candidate_ids 缺失 / mode 非法}
        "409": {description: 候选作业不属于本工程、未成功、装配体已变化，或 ETag 不匹配}
        "422":
          description: 候选不存在，或成员在当前装配体里解析不到
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: object
                    properties:
                      message: {type: string}
                      unresolved:
                        type: array
                        items:
                          type: object
                          properties:
                            candidate: {type: string}
                            member: {}
                            reason: {type: string}
  /v1/projects/{pid}/figures:
    parameters:
      - {in: path, name: pid, required: true, schema: {type: string}}
      - {in: query, name: include_images, schema: {type: boolean, default: false}}
    get: {tags: [出图], summary: 最近一次出图结果, responses: {"200": {description: ok}}}
  /v1/jobs/{job_id}:
    parameters: [{in: path, name: job_id, required: true, schema: {type: string}}]
    get:
      tags: [作业]
      summary: 查询作业状态
      responses:
        "200": {content: {application/json: {schema: {$ref: '#/components/schemas/Job'}}}}
        "404": {description: 未找到作业}
    delete:
      tags: [作业]
      summary: 取消作业
      responses:
        "200":
          content:
            application/json:
              schema: {type: object, properties: {id: {type: string}, state: {type: string}}}
        "404": {description: 未找到作业}
  /v1/jobs/{job_id}/events:
    parameters:
      - {in: path, name: job_id, required: true, schema: {type: string}}
      - {in: header, name: Last-Event-ID, schema: {type: string}, description: 断线重连从此 id 之后重放}
    get:
      tags: [作业]
      summary: 作业事件流（SSE）
      description: >
        text/event-stream，每帧带 `id:`、`event:`（stage/progress/log/done/error）与 `data:`
        （JSON）。支持 Last-Event-ID 重放。不与 GZip 同用。
      responses:
        "200":
          description: SSE 流
          content:
            text/event-stream:
              schema: {type: string}
  /v1/projects/{pid}/export:
    parameters: [{in: path, name: pid, required: true, schema: {type: string}}]
    post:
      tags: [导出]
      summary: 导出附图包（异步 202 → export_id，绑定一次成功渲染）
      description: >
        绑定到一次成功的渲染作业（render_job_id，缺省取该工程**当前版本**的渲染作业），读其不可变
        产物快照打包，不读共享工作目录（R1 #7）。与浏览器导出、MCP get_export 共用单一导出服务
        （R1e #3）：提交时在版本库状态锁内一次完成「完整性校验（按声明的产物清单，缺失/截断/
        零字节即拒）+ 可发布（封口 ok）+ 登记引用」，失败 409；导出结束或任何失败路径释放引用。
        WP2 F1：PDF / Word 是主交付——每个带图号的版本（递交版 / 交底版）各一份，A4、页边
        25/25/15/15 mm、图区预设 standard 170×257 / conservative 165×245、dpi 72–600（默认 300），
        页序 = 图号序；写出后对**文件本身**逐页核验（页幅、页边、缩放后最小字高 mm 与 px、图号存在、
        页数 = 图数、文件齐全），不通过的文档移到包内 _未通过核验/，对应项 fail 并给原因。DXF / DWG
        为源文件；DWG 转换器不可用 → skip + 原因（能力接口 dwg_available=false 事前告知）。包内另附
        附图说明.txt、核对清单.txt（人工核对说明书件号，M1 无自动对表）、核验报告.json。
        清单按「图号×版本×格式」逐项 ok/skip/fail（R1 #8），每个 skip/fail 在 reasons 里有原因。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                render_job_id: {type: string, description: 要导出的成功渲染作业；缺省取最近一次}
                variant: {type: string, enum: [filing, disclosure, both], default: both}
                formats:
                  type: array
                  items: {type: string, enum: [pdf, docx, dxf, dwg, png]}
                  default: [pdf, docx, dxf]
                dpi: {type: integer, default: 300, minimum: 72, maximum: 600, description: PDF/Word/PNG 栅格分辨率}
                sheet_preset: {type: string, enum: [standard, conservative], default: standard}
                plan_etag:
                  type: string
                  description: 与被导出渲染的输入版本比对，不一致 409（而非与当前 plan 比）
      responses:
        "202":
          content:
            application/json:
              schema:
                type: object
                properties:
                  export_id: {type: string}
                  job_id: {type: string}
                  render_job_id: {type: string}
        "400": {description: 未知 variant / sheet_preset / format，或 dpi 越界}
        "409": {description: 没有可导出的成功渲染、其版本未通过完整性校验/未全部过闸，或 plan_etag 与被导出渲染不一致}
      x-manifest-note: >
        作业 result 为 ExportResult：manifest 的键是 "图号/版本/格式"（版本为 交底版/递交版），值为
        ok|skip|fail；reasons 给每个 skip/fail 的原因；items 是逐「版本×格式」汇总行；documents 是
        每份 PDF/Word 的逐页核验报告。
  /v1/exports/{export_id}:
    parameters: [{in: path, name: export_id, required: true, schema: {type: string}}]
    get:
      tags: [导出]
      summary: 导出作业状态（Job；result 为 ExportResult：清单、逐页核验与下载地址）
      responses:
        "200": {content: {application/json: {schema: {$ref: '#/components/schemas/Job'}}}}
        "404": {description: 未找到}
  /v1/exports/{export_id}/download:
    parameters: [{in: path, name: export_id, required: true, schema: {type: string}}]
    get:
      tags: [导出]
      summary: 下载导出 zip
      responses:
        "200": {description: zip, content: {application/zip: {schema: {type: string, format: binary}}}}
        "404": {description: 还没就绪}
  /v1/flowcharts/guide:
    get: {tags: [流程图], summary: 流程图 JSON 格式说明, responses: {"200": {description: ok}}}
  /v1/flowcharts/render:
    post: {tags: [流程图], summary: 按语义 JSON 出流程图, responses: {"200": {description: ok}}}
  /v1/flowcharts/generate:
    post: {tags: [AI], summary: 文字描述 → 流程图, responses: {"200": {description: ok}}}
  /p/{pid}/api/render/status:
    parameters: [{in: path, name: pid, required: true, schema: {type: string}}]
    get:
      tags: [浏览器子应用]
      summary: 渲染状态：已发布版本（result）与本次作业（job）分开返回
      description: >
        挂在工作台 /p/{pid}/ 下的 Plan Studio 子应用接口（浏览器用；同样接受 Bearer）。语义见
        components.schemas.RenderStatus：result 永远是已发布版本，job 是本次作业状态（含失败诊断）。
        GET /p/{pid}/api/state 同理返回 render（已发布）+ version + render_job（本次作业）。
      responses:
        "200": {content: {application/json: {schema: {$ref: '#/components/schemas/RenderStatus'}}}}
  /mcp:
    post:
      tags: [MCP]
      summary: MCP（Streamable HTTP, JSON-RPC 2.0）
      description: >
        MCP 客户端按 URL 挂载，带 Bearer token。工具：list_projects、get_project_parts、
        update_terms、render_project、get_project_figures、ai_draft_terms、流程图相关，
        WP1 新增的作业工具 submit_render / get_job / cancel_job / get_export（WP2：可传 dpi、
        sheet_preset），以及 WP2 新增的 suggest_figures（候选分图作业）/ accept_figure_candidates。
      requestBody:
        content: {application/json: {schema: {type: object}}}
      responses:
        "200": {description: JSON-RPC 结果}
        "202": {description: 仅通知时无响应体}
